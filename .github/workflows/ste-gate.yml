name: ste-gate

# Fast path: PRs only run inference against the already-trained ONNX models,
# never training. Restores the cached model (keyed on the training/export
# scripts) or downloads it from the latest Release on a cache miss.

on:
  pull_request:
    paths: ["**/*.md", "**/*.mdx", "**/*.txt", "**/*.rst"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Cache trained ONNX models
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            onnx_violations
            onnx_rewriter
          key: models-v1-${{ hashFiles('train_tropes.py', 'train_rewriter.py', 'export_onnx_tropes.py', 'runtime/regex_onnx.py', 'scripts/seed_labels.py', 'seeds/trope.parquet') }}

      - name: Restore models from latest release
        if: steps.cache.outputs.cache-hit != 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # `gh release download` with no tag looks for the "latest" release,
          # and GitHub never marks a pre-release as latest. The only release
          # here is a pre-release, so the bare command reported "release not
          # found". Name the newest release, pre-release or not, explicitly.
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          [ -n "$tag" ] || { echo "no release found -- train locally and publish a release first"; exit 1; }
          gh release download "$tag" --pattern "model.tar.zst" -D . || { echo "release $tag has no model.tar.zst -- train locally and publish a release first"; exit 1; }
          pip install zstandard
          python zst.py -d model.tar.zst model.tar
          tar -xf model.tar

      # The package list used to be written out here and again in the prek job,
      # and neither copy could drift toward pixi.toml without the other. The
      # `gate` environment declares it once, with no-default-feature so none of
      # the training stack comes with it.
      - uses: prefix-dev/setup-pixi@v0
        with: { environments: gate, cache: true }

      - name: Run gate against PR diff
        run: |
          pixi run -e gate python gate.py --base-ref "origin/${{ github.base_ref }}" --threshold 0.5 --max-findings 0 | tee gate_report.txt

      - name: Write job summary
        if: always()
        run: cat gate_report.txt >> "$GITHUB_STEP_SUMMARY"

  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Cache trained ONNX models
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            onnx_violations
            onnx_rewriter
          key: models-v1-${{ hashFiles('train_tropes.py', 'train_rewriter.py', 'export_onnx_tropes.py', 'runtime/regex_onnx.py', 'scripts/seed_labels.py', 'seeds/trope.parquet') }}

      - name: Restore models from latest release
        if: steps.cache.outputs.cache-hit != 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # `gh release download` with no tag looks for the "latest" release,
          # and GitHub never marks a pre-release as latest. The only release
          # here is a pre-release, so the bare command reported "release not
          # found". Name the newest release, pre-release or not, explicitly.
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          [ -n "$tag" ] || { echo "no release found -- train locally and publish a release first"; exit 1; }
          gh release download "$tag" --pattern "model.tar.zst" -D . || { echo "release $tag has no model.tar.zst -- train locally and publish a release first"; exit 1; }
          pip install zstandard
          python zst.py -d model.tar.zst model.tar
          tar -xf model.tar

      # prek invokes the ste-gate hook as `pixi run -e gate python gate.py`, so
      # pixi has to be here and the environment has to be materialised. The old
      # `pip install` did not reach the hook at all: prek gives a system hook a
      # sanitized PATH, so `python` resolved to an interpreter without numpy,
      # which is the ModuleNotFoundError this workflow reported while appearing
      # to have installed it.
      - uses: prefix-dev/setup-pixi@v0
        with: { environments: gate, cache: true }
      - run: pip install prek

      - name: Run pre-commit hooks (prek)
        run: prek run --all-files --show-diff-on-failure --color always