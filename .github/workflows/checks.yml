name: Checks

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The ste-gate hook runs `pixi run -e gate python gate.py`, so pixi has to
      # be on PATH here and the environment has to be materialised. Without it
      # prek reports `Failed to run pixi run -e gate python gate.py: No such
      # file or directory`, which reads like a hook bug and is a missing tool.
      - uses: prefix-dev/setup-pixi@v0
        with: { environments: gate, cache: true }
      - run: pip install prek
      - run: prek run --all-files --show-diff-on-failure --color always
